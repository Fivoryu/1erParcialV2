spring:
  application:
    name: uml-diagrammer-backend
  datasource:
    url: ${DIAGRAMADOR_DB_URL:jdbc:postgresql://localhost:5432/diagramador}
    username: diagramador
    password: diagramador
    hikari:
      # The schema authority (docs/puds/datos/02-esquema-fisico.sql) runs
      # `SET search_path TO diagrammer, public` before creating the extensions and the types of
      # this schema. Every pooled connection honours the same search path so PostgreSQL reports
      # those type names unqualified (`citext`, `classifier_kind`, ...) instead of
      # `"diagrammer"."citext"`, which is what `ddl-auto: validate` compares against.
      connection-init-sql: SET search_path TO diagrammer, public
  jpa:
    # Flyway owns the schema; Hibernate only checks that the mapping matches it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: diagrammer
  flyway:
    enabled: true
    schemas: diagrammer
    default-schema: diagrammer
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
