spring:
  application:
    name: uml-diagrammer-backend
  datasource:
    url: ${DIAGRAMADOR_DB_URL:jdbc:postgresql://localhost:5432/diagramador}
    username: ${DIAGRAMADOR_DB_USERNAME:diagramador}
    password: ${DIAGRAMADOR_DB_PASSWORD:diagramador}
    hikari:
      # The schema authority (docs/puds/datos/02-esquema-fisico.sql) runs
      # `SET search_path TO diagrammer, public` before creating the extensions and the types of
      # this schema. Every pooled connection honours the same search path so PostgreSQL reports
      # those type names unqualified (`citext`, `classifier_kind`, ...) instead of
      # `"diagrammer"."citext"`, which is what `ddl-auto: validate` compares against.
      connection-init-sql: SET search_path TO diagrammer, public
  servlet:
    multipart:
      # Spring's default is 1 MB per file, below the 5 MB attachment limit enforced by ChatAttachmentService.
      max-file-size: 6MB
      max-request-size: 7MB
  jpa:
    # Flyway owns the schema; Hibernate only checks that the mapping matches it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: diagrammer
  flyway:
    enabled: true
    schemas: diagrammer
    default-schema: diagrammer
    locations: classpath:db/migration

diagrammer:
  mobile-gateway:
    # Generated HTTP services currently bind all interfaces. Keep this disabled until their network is isolated
    # from untrusted clients; the gateway is the only intended caller and never forwards platform credentials.
    enabled: ${DIAGRAMMER_MOBILE_GATEWAY_ENABLED:false}
    upstream-host: ${DIAGRAMMER_MOBILE_GATEWAY_UPSTREAM_HOST:127.0.0.1}
    connect-timeout-millis: ${DIAGRAMMER_MOBILE_GATEWAY_CONNECT_TIMEOUT_MILLIS:2000}
    request-timeout-millis: ${DIAGRAMMER_MOBILE_GATEWAY_REQUEST_TIMEOUT_MILLIS:5000}
    max-response-bytes: ${DIAGRAMMER_MOBILE_GATEWAY_MAX_RESPONSE_BYTES:1048576}
  operator:
    # An empty value disables the operator principal, and any request shaped like an operator
    # credential then falls back to normal session resolution. No credential is ever committed,
    # so this key has no default value.
    token: ${DIAGRAMMER_OPERATOR_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
