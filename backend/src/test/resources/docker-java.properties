# docker-java (shaded by Testcontainers) reads this file from the classpath before it applies
# environment and system property overrides.
#
# Testcontainers pins RemoteApiVersion.VERSION_1_32 whenever the docker-java configuration reports
# an unknown API version, and the Docker Engine on the measured machine (Docker Desktop 29.8.0)
# rejects every request below API 1.40 with HTTP 400. Pinning a supported version keeps the
# Testcontainers integration tests able to talk to that engine.
api.version=1.44
